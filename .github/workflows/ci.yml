name: Build and Test Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: latest
          cache: true

      - name: Install dependencies
        run: pixi install --locked

      - name: Build packages
        run: pixi run colcon build --event-handlers console_direct+

      - name: Run tests
        run: pixi run colcon test --event-handlers console_direct+

      - name: Report test results
        if: always()
        run: pixi run colcon test-result --verbose

      - name: Check clang-format
        run: pixi run colcon build --packages-select pubsub-demo turtlesim-demo --cmake-target format-check --event-handlers console_direct+